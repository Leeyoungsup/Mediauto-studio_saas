<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeDIAuto Studio — Home</title>
    <link rel="icon" href="assets/app_icon.ico">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header class="home-header">
        <div class="home-header-inner">
            <a href="/home.html" class="home-brand">
                <img src="assets/logo.png" alt="MeDIAuto Studio" class="home-logo">
            </a>
            <nav class="home-nav">
                <a href="/home.html" class="home-nav-item active">Home</a>
                <a href="/app.html" class="home-nav-item">Viewer</a>
                <a href="/admin.html" class="home-nav-item" id="btn-admin" hidden>Admin</a>
            </nav>
            <div class="home-user-info">
                <span id="user-name">—</span>
                <span class="role-badge" id="user-role">—</span>
                <button class="home-btn-ghost" id="btn-logout">Logout</button>
            </div>
        </div>
    </header>

    <main class="home-main">
        <!-- 통계 카드 -->
        <section class="stat-cards">
            <div class="stat-card">
                <div class="stat-icon stat-icon-slides">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
                </div>
                <div class="stat-body">
                    <span class="stat-value" id="stat-total">0</span>
                    <span class="stat-label">Total Slides</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-done">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                </div>
                <div class="stat-body">
                    <span class="stat-value" id="stat-done">0</span>
                    <span class="stat-label">Reviewed</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-progress">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                </div>
                <div class="stat-body">
                    <span class="stat-value" id="stat-in-progress">0</span>
                    <span class="stat-label">In Progress</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon stat-icon-ai">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a4 4 0 014 4v2a4 4 0 01-8 0V6a4 4 0 014-4z"/><path d="M6 12v1a6 6 0 0012 0v-1"/><path d="M12 19v3"/></svg>
                </div>
                <div class="stat-body">
                    <span class="stat-value" id="stat-ai-total">0</span>
                    <span class="stat-label">AI Analyzed</span>
                </div>
            </div>
        </section>

        <!-- 저장공간 + 폴더 구성 -->
        <section class="home-section">
            <h2 class="section-title">Storage & Projects</h2>
            <div class="storage-overview">
                <div class="storage-bar-wrap">
                    <div class="storage-bar-track">
                        <div class="storage-bar-fill" id="storage-bar-fill"></div>
                    </div>
                    <div class="storage-info">
                        <span id="storage-used">—</span>
                        <span class="storage-sep">/</span>
                        <span id="storage-total">—</span>
                        <span class="storage-pct" id="storage-pct"></span>
                    </div>
                </div>
                <div class="folder-tree" id="folder-tree">
                    <div class="folder-tree-loading">Loading folders...</div>
                </div>
            </div>
        </section>

        <!-- 최근 슬라이드 -->
        <section class="home-section">
            <div class="section-header">
                <h2 class="section-title">Recent Slides</h2>
                <a href="/app.html" class="section-link">View All</a>
            </div>
            <div class="recent-grid" id="recent-grid">
                <div class="recent-empty">Loading...</div>
            </div>
        </section>

        <!-- 빠른 접근 -->
        <section class="home-section">
            <h2 class="section-title">Quick Actions</h2>
            <div class="quick-actions">
                <a href="/app.html" class="quick-card">
                    <div class="quick-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
                    </div>
                    <span class="quick-label">Open Viewer</span>
                    <span class="quick-desc">WSI Slide Viewer</span>
                </a>
                <a href="#" class="quick-card" id="quick-upload" onclick="event.preventDefault(); window.open('/upload.html?path=', 'upload_popup', 'width=560,height=640,resizable=yes,scrollbars=yes');">
                    <div class="quick-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                    <span class="quick-label">Upload Slide</span>
                    <span class="quick-desc">Upload WSI files</span>
                </a>
                <a href="/admin.html" class="quick-card" id="quick-admin">
                    <div class="quick-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    </div>
                    <span class="quick-label">Admin Panel</span>
                    <span class="quick-desc">User & system management</span>
                </a>
            </div>
        </section>
    </main>

    <footer class="home-footer">
        <span>MeDIAuto Studio &copy; 2024-2026</span>
    </footer>

    <script src="js/home.js"></script>
</body>
</html>
