<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeDIAuto Studio - Data Linkage</title>
    <link rel="icon" href="assets/app_icon.ico">
    <link rel="stylesheet" href="css/shared-header.css?v=20260520-04">
    <link rel="stylesheet" href="css/style.css?v=20260824-02">
</head>
<body class="data-linkage-page">
    <div id="shared-header-root">
        <header class="shared-header">
            <div class="shared-header-inner">
                <a href="/home" class="shared-brand">
                    <img src="assets/logo.png" alt="MeDIAuto Studio" class="shared-logo">
                </a>
                <nav class="shared-nav" aria-label="Primary">
                    <a href="/home" class="shared-nav-item">Home</a>
                    <a href="/project" class="shared-nav-item">Project</a>
                    <a href="/data-linkage" class="shared-nav-item active">Data Linkage</a>
                    <a href="/ai" class="shared-nav-item">AI</a>
                    <a href="/tissue-annotation" class="shared-nav-item">Annotation</a>
                </nav>
                <div class="shared-user-info">
                    <button class="shared-logout" type="button" onclick="localStorage.clear(); location.href='/login';">Logout</button>
                </div>
            </div>
        </header>
    </div>

    <main class="data-linkage-shell">
        <section class="data-linkage-topbar">
            <div class="data-linkage-title">
                <strong>Data Linkage</strong>
            </div>
            <div class="data-linkage-filters">
                <select id="dl-project-select" aria-label="Project">
                    <option value="">Project (all) *</option>
                </select>
                <select id="dl-hospital-select" aria-label="Hospital">
                    <option value="">Hospital (all) *</option>
                </select>
                <input id="dl-sample-search" type="search" placeholder="Sample No" aria-label="Sample No">
                <button id="dl-search-btn" type="button">Search</button>
                <select id="dl-page-size" class="data-linkage-page-size" aria-label="Rows per page">
                    <option value="15">15 per page</option>
                    <option value="30">30 per page</option>
                    <option value="50">50 per page</option>
                </select>
            </div>
        </section>

        <section class="data-linkage-workspace">
            <aside class="data-linkage-list-panel">
                <div class="data-linkage-table-head">
                    <span>No</span>
                    <button type="button" data-sort="case_name">Sample ID</button>
                    <button type="button" data-sort="has_clinical_info">Clinical Info</button>
                    <button type="button" data-sort="last_activity">Last activity</button>
                </div>
                <div id="dl-case-list" class="data-linkage-case-list"></div>
                <div class="data-linkage-pager">
                    <button id="dl-prev-page" type="button" aria-label="Previous page">&lt;</button>
                    <div id="dl-page-numbers" class="data-linkage-page-numbers" aria-label="Page numbers"></div>
                    <button id="dl-next-page" type="button" aria-label="Next page">&gt;</button>
                </div>
                <div id="dl-total-label" class="data-linkage-total">Showing 0 entries</div>
            </aside>

            <section class="data-linkage-preview-panel">
                <div class="data-linkage-viewer-tools" aria-label="Preview tools">
                    <button id="dl-zoom-in" type="button" title="Zoom in">+</button>
                    <button id="dl-zoom-out" type="button" title="Zoom out">-</button>
                    <button id="dl-reset-view" type="button" title="Reset">H</button>
                    <button id="dl-fit-view" type="button" title="Fit">[]</button>
                    <span id="dl-zoom-label" class="data-linkage-zoom-label">100%</span>
                </div>
                <div class="data-linkage-preview-stage">
                    <img id="dl-preview-img" alt="Selected slide preview" hidden>
                    <div id="dl-preview-empty" class="data-linkage-empty">Select a sample to preview linked slides.</div>
                </div>
            </section>

            <aside class="data-linkage-detail-panel">
                <div class="data-linkage-case-summary">
                    <div><span>Year:</span> <strong id="dl-year">-</strong></div>
                    <div><span>Sample ID:</span> <strong id="dl-sample-id">-</strong></div>
                </div>
                <div id="dl-thumbnail-row" class="data-linkage-thumbnails"></div>
                <div id="dl-selected-slide" class="data-linkage-selected-slide">Selected image: -</div>
                <div class="data-linkage-ai-actions" aria-label="Open in AI viewer">
                    <button id="dl-ai-view-btn" type="button" disabled>View</button>
                    <button id="dl-ai-multi-view-btn" type="button" disabled>Multi View</button>
                    <span id="dl-ai-selection-status">Select 2–4 images for Multi View</span>
                </div>
                <form id="dl-clinical-form" class="data-linkage-form">
                    <div class="data-linkage-form-empty">Clinical fields appear after selecting a sample.</div>
                </form>
                <div class="data-linkage-savebar">
                    <span id="dl-save-status">Not saved</span>
                    <button id="dl-save-btn" type="button">Save</button>
                </div>
            </aside>
        </section>
    </main>

    <script src="js/shared-header.js?v=20260529-03"></script>
    <script>
        (function () {
            var user = {};
            try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch (_) { user = {}; }
            window.MediautoHeader && window.MediautoHeader.render({
                active: 'data-linkage',
                user: user,
                showAdmin: user && user.str_role === 'admin'
            });
        })();
    </script>
    <script type="module" src="js/data-linkage.js?v=20260824-02"></script>
</body>
</html>
