<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeDIAuto Studio — Login</title>
    <link rel="icon" href="assets/app_icon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: #f5f6fa; color: #3c3f55;
        }
        .login-wrapper {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .login-card {
            background: #fff; border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            padding: 40px; width: 100%; max-width: 420px;
        }
        .login-logo {
            display: block; margin: 0 auto 24px; height: 48px;
        }
        .login-title {
            text-align: center; font-size: 20px; font-weight: 700;
            color: #202124; margin-bottom: 8px;
        }
        .login-subtitle {
            text-align: center; font-size: 13px; color: #5f6368;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600;
            color: #3c4043; margin-bottom: 6px;
        }
        .form-group input {
            width: 100%; padding: 10px 14px;
            border: 1px solid #dadce0; border-radius: 8px;
            font-size: 14px; color: #202124; background: #fff;
            transition: border-color 0.15s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 2px rgba(108,92,231,0.18);
        }
        .form-group input::placeholder { color: #9aa0a6; }
        .form-error {
            color: #d93025; font-size: 12px; margin-top: 4px;
            display: none;
        }
        .form-error.visible { display: block; }
        .btn-primary {
            width: 100%; padding: 12px; margin-top: 8px;
            background: #6c5ce7; color: #fff; border: none;
            border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.15s;
        }
        .btn-primary:hover { background: #5a4bd1; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            width: 100%; padding: 10px; margin-top: 12px;
            background: transparent; color: #6c5ce7; border: 1px solid #dadce0;
            border-radius: 8px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.15s;
        }
        .btn-secondary:hover { background: #ede9fe; border-color: #6c5ce7; }
        .alert-box {
            padding: 10px 14px; border-radius: 8px;
            font-size: 12px; margin-bottom: 16px;
            display: none;
        }
        .alert-box.error {
            background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb;
            display: block;
        }
        .alert-box.success {
            background: #e6f4ea; color: #137333; border: 1px solid #c3e6cb;
            display: block;
        }
        .mode-toggle {
            text-align: center; margin-top: 20px; font-size: 12px; color: #5f6368;
        }
        .mode-toggle a {
            color: #6c5ce7; cursor: pointer; text-decoration: none; font-weight: 500;
        }
        .mode-toggle a:hover { text-decoration: underline; }
        .register-fields { display: none; }
        .register-fields.visible { display: block; }
        .password-rules {
            font-size: 11px; color: #5f6368; margin-top: 4px; line-height: 1.5;
        }
        .password-rules.visible { display: block; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <img src="assets/logo.png" alt="MeDIAuto Studio" class="login-logo">
            <h1 class="login-title" id="page-title">Sign In</h1>
            <p class="login-subtitle" id="page-subtitle">병리 AI 분석 플랫폼에 로그인하세요</p>

            <div id="alert-box" class="alert-box"></div>

            <form id="auth-form" autocomplete="on">
                <!-- Register only fields -->
                <div class="register-fields" id="register-fields">
                    <div class="form-group">
                        <label for="name">이름 <span style="color:#d93025">*</span></label>
                        <input type="text" id="name" placeholder="홍길동" maxlength="100" autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="department">부서</label>
                        <input type="text" id="department" placeholder="병리과" maxlength="100" autocomplete="organization">
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-id">아이디</label>
                    <input type="text" id="login-id" placeholder="hong1234" required minlength="4" maxlength="30" autocomplete="username" pattern="[a-zA-Z0-9_]{4,30}">
                    <div class="password-rules" id="id-rules" style="display:none;">
                        4~30자, 영문/숫자/언더스코어만 가능
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="current-password">
                    <div class="password-rules" id="password-rules" style="display:none;">
                        영문 대/소문자 + 숫자 + 특수문자 포함 8자 이상
                    </div>
                </div>

                <!-- MFA TOTP 입력 (MFA 활성화 사용자만 표시) -->
                <div class="form-group" id="mfa-group" style="display:none;">
                    <label for="totp-code">2차 인증 코드 (6자리)</label>
                    <input type="text" id="totp-code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code">
                </div>

                <button type="submit" class="btn-primary" id="btn-submit">로그인</button>
            </form>

            <div class="mode-toggle" id="mode-toggle">
                계정이 없으신가요? <a id="toggle-link" href="#">회원가입</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/auth';
        const PASSWORD_PATTERN = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
        let isRegisterMode = false;

        const $form = document.getElementById('auth-form');
        const $loginId = document.getElementById('login-id');
        const $idRules = document.getElementById('id-rules');
        const $password = document.getElementById('password');
        const $name = document.getElementById('name');
        const $department = document.getElementById('department');
        const $btnSubmit = document.getElementById('btn-submit');
        const $alertBox = document.getElementById('alert-box');
        const $toggleLink = document.getElementById('toggle-link');
        const $registerFields = document.getElementById('register-fields');
        const $pageTitle = document.getElementById('page-title');
        const $pageSubtitle = document.getElementById('page-subtitle');
        const $passwordRules = document.getElementById('password-rules');

        // 이미 로그인 되어있으면 메인으로
        if (localStorage.getItem('access_token')) {
            window.location.href = '/home.html';
        }

        function showAlert(message, type = 'error') {
            // FastAPI validation error detail은 배열일 수 있음
            if (typeof message === 'object') {
                if (Array.isArray(message)) {
                    message = message.map(e => e.msg || JSON.stringify(e)).join(', ');
                } else {
                    message = message.msg || JSON.stringify(message);
                }
            }
            $alertBox.textContent = message;
            $alertBox.className = `alert-box ${type}`;
        }

        function hideAlert() {
            $alertBox.className = 'alert-box';
            $alertBox.textContent = '';
        }

        function toggleMode() {
            isRegisterMode = !isRegisterMode;
            hideAlert();

            if (isRegisterMode) {
                $pageTitle.textContent = 'Sign Up';
                $pageSubtitle.textContent = '새 계정을 생성하세요';
                $btnSubmit.textContent = '회원가입';
                document.getElementById('mode-toggle').innerHTML =
                    '이미 계정이 있으신가요? <a id="toggle-link" href="#">로그인</a>';
                $registerFields.classList.add('visible');
                $passwordRules.style.display = 'block';
                $idRules.style.display = 'block';
                $password.autocomplete = 'new-password';
            } else {
                $pageTitle.textContent = 'Sign In';
                $pageSubtitle.textContent = '병리 AI 분석 플랫폼에 로그인하세요';
                $btnSubmit.textContent = '로그인';
                document.getElementById('mode-toggle').innerHTML =
                    '계정이 없으신가요? <a id="toggle-link" href="#">회원가입</a>';
                $registerFields.classList.remove('visible');
                $passwordRules.style.display = 'none';
                $idRules.style.display = 'none';
                $password.autocomplete = 'current-password';
            }

            // Re-bind toggle link
            document.getElementById('toggle-link').addEventListener('click', (e) => {
                e.preventDefault();
                toggleMode();
            });
        }

        $toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            toggleMode();
        });

        $form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            $btnSubmit.disabled = true;

            try {
                if (isRegisterMode) {
                    await doRegister();
                } else {
                    await doLogin();
                }
            } catch (err) {
                showAlert(err.message, 'error');
            } finally {
                $btnSubmit.disabled = false;
            }
        });

        let mfaPending = false;

        async function doLogin() {
            const $mfaGroup = document.getElementById('mfa-group');
            const $totpCode = document.getElementById('totp-code');

            const body = {
                str_login_id: $loginId.value.trim(),
                str_password: $password.value,
            };
            // MFA 코드가 표시되어 있으면 함께 전송
            if (mfaPending && $totpCode.value.trim()) {
                body.str_totp_code = $totpCode.value.trim();
            }

            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                body: JSON.stringify(body),
            });

            const data = await res.json();

            if (!res.ok) {
                const detail = data.detail;
                const msg = typeof detail === 'string' ? detail
                    : Array.isArray(detail) ? detail.map(e => e.msg || JSON.stringify(e)).join(', ')
                    : JSON.stringify(detail) || 'Login failed';
                throw new Error(msg);
            }

            // MFA 필요 응답
            if (data.bool_mfa_required) {
                mfaPending = true;
                $mfaGroup.style.display = 'block';
                $totpCode.focus();
                showAlert(data.str_message || '2차 인증 코드를 입력해 주세요.', 'success');
                return;
            }

            // 토큰 저장
            localStorage.setItem('access_token', data.str_access_token);
            localStorage.setItem('refresh_token', data.str_refresh_token);
            localStorage.setItem('user', JSON.stringify(data.dict_user));
            localStorage.setItem('token_expires', Date.now() + data.int_expires_in * 1000);
            mfaPending = false;

            window.location.href = '/home.html';
        }

        async function doRegister() {
            if (!$name.value.trim()) {
                throw new Error('이름을 입력해주세요.');
            }
            if (!PASSWORD_PATTERN.test($password.value)) {
                throw new Error('비밀번호: 영문 대/소문자 + 숫자 + 특수문자 포함 8자 이상');
            }
            const res = await fetch(`${API_BASE}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    str_login_id: $loginId.value.trim(),
                    str_password: $password.value,
                    str_name: $name.value.trim(),
                    str_department: $department.value.trim(),
                }),
            });

            const data = await res.json();

            if (!res.ok) {
                const detail = data.detail;
                const msg = typeof detail === 'string' ? detail
                    : Array.isArray(detail) ? detail.map(e => e.msg || JSON.stringify(e)).join(', ')
                    : JSON.stringify(detail) || 'Registration failed';
                throw new Error(msg);
            }

            const msg = data.str_message
                || (data.bool_requires_approval
                    ? '회원가입이 완료되었습니다. 관리자 승인 후 로그인 가능합니다.'
                    : '회원가입 성공! 로그인해주세요.');
            showAlert(msg, 'success');
            // 로그인 모드로 전환
            setTimeout(() => {
                isRegisterMode = true; // toggleMode will flip it
                toggleMode();
            }, 2500);
        }
    </script>
</body>
</html>
