<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeDIAuto Studio — Upload</title>
    <link rel="icon" href="assets/app_icon.ico">
    <style>
        :root {
            --accent: #6c5ce7;
            --accent-hover: #5a4bd1;
            --accent-soft: #ede9fe;
            --bg: #f5f6fa;
            --surface: #ffffff;
            --border: #e1e4eb;
            --text: #2d3142;
            --text-dim: #6c7083;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: var(--bg); color: var(--text);
            height: 100%;
        }
        body { display: flex; flex-direction: column; }

        /* Header */
        .upload-header {
            background: linear-gradient(135deg, #2d3142, var(--accent));
            color: #fff; padding: 12px 20px;
            display: flex; align-items: center; gap: 12px;
            flex-shrink: 0;
        }
        .upload-header img { height: 28px; filter: brightness(0) invert(1); }
        .upload-header-title { font-size: 14px; font-weight: 700; }

        /* Drop zone */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            margin: 16px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            flex-shrink: 0;
        }
        .drop-zone.dragover { border-color: var(--accent); background: var(--accent-soft); }
        .drop-zone-icon { font-size: 36px; color: var(--accent); margin-bottom: 8px; }
        .drop-zone-text { font-size: 13px; color: var(--text-dim); }
        .drop-zone-text strong { color: var(--accent); cursor: pointer; }
        .drop-zone input { display: none; }

        /* File list */
        .file-list {
            flex: 1; overflow-y: auto; padding: 0 16px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .file-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 12px 14px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .file-item-top {
            display: flex; align-items: center; gap: 10px;
        }
        .file-item-name {
            flex: 1; font-size: 13px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-item-size { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
        .file-item-status {
            font-size: 11px; font-weight: 600; flex-shrink: 0;
            padding: 2px 8px; border-radius: 4px;
        }
        .status-waiting { background: #eee; color: #888; }
        .status-uploading { background: var(--accent-soft); color: var(--accent); }
        .status-done { background: #e8f8ef; color: var(--success); }
        .status-error { background: #fde8e8; color: var(--danger); }

        .file-item-bar {
            height: 6px; background: #f0f1f5; border-radius: 3px;
            overflow: hidden;
        }
        .file-item-fill {
            height: 100%; border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), #a29bfe);
            transition: width 0.2s;
            width: 0;
        }
        .file-item-fill.done { background: var(--success); }
        .file-item-fill.error { background: var(--danger); }
        .file-item-fill.conflict { background: #f1c40f; }

        .status-conflict { background: #fff6db; color: #9a6b00; }
        .status-skipped { background: #eef1f6; color: var(--text-dim); }

        .conflict-panel {
            margin: 0 16px 10px;
            border: 1px solid #f1d27a;
            border-radius: 8px;
            background: #fffaf0;
            flex-shrink: 0;
            overflow: hidden;
        }
        .conflict-panel[hidden] { display: none; }
        .conflict-panel-head {
            padding: 10px 12px;
            border-bottom: 1px solid #f1d27a;
            color: #5f4200;
            font-size: 12px;
            font-weight: 800;
        }
        .conflict-list {
            display: flex;
            flex-direction: column;
            max-height: 180px;
            overflow-y: auto;
        }
        .conflict-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
            padding: 10px 12px;
            border-top: 1px solid rgba(241, 210, 122, 0.6);
            font-size: 12px;
        }
        .conflict-item:first-child { border-top: 0; }
        .conflict-name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 700;
        }
        .conflict-action {
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fff;
            color: var(--text);
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .conflict-action.overwrite {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Footer */
        .upload-footer {
            padding: 12px 16px; border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; background: var(--surface);
        }
        .upload-summary { font-size: 12px; color: var(--text-dim); }
        .btn-upload {
            padding: 8px 24px; border: none; border-radius: 8px;
            background: var(--accent); color: #fff;
            font-size: 13px; font-weight: 700; cursor: pointer;
            transition: background 0.15s;
        }
        .btn-upload:hover { background: var(--accent-hover); }
        .btn-upload:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-close {
            padding: 8px 20px; border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); color: var(--text);
            font-size: 13px; cursor: pointer;
        }
        .upload-footer-btns { display: flex; gap: 8px; }

        /* Folder selector */
        .upload-target {
            margin: 0 16px 8px;
            display: flex; flex-direction: column; gap: 8px;
            flex-shrink: 0;
        }
        .folder-selector {
            display: flex; align-items: center; gap: 8px;
            flex-shrink: 0;
        }
        .folder-selector label {
            font-size: 12px; font-weight: 600; color: var(--text-dim);
            white-space: nowrap;
        }
        .folder-selector select {
            flex: 1; padding: 6px 10px;
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 12px; color: var(--text);
            background: var(--surface);
            cursor: pointer;
        }
        .folder-selector select:focus {
            outline: none; border-color: var(--accent);
        }
        .upload-target-note {
            font-size: 11px; color: var(--text-dim);
            padding-left: 74px;
        }
        .upload-blocked {
            margin: 16px; padding: 14px;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--surface); color: var(--text-dim);
            font-size: 13px; line-height: 1.5;
        }
    </style>
    <script src="/js/security-session.js?v=20261008-01"></script>
</head>
<body>
    <div class="upload-header">
        <img src="assets/logo.png" alt="logo">
        <span class="upload-header-title">Slide Upload</span>
    </div>

    <div class="upload-target" id="upload-target">
        <div class="folder-selector">
            <label for="project-select">Project:</label>
            <select id="project-select"></select>
        </div>
        <div class="folder-selector">
            <label for="folder-select">Folder:</label>
            <select id="folder-select"></select>
        </div>
        <div class="upload-target-note" id="upload-target-note"></div>
    </div>
    <div class="upload-blocked" id="upload-blocked" hidden>
        Create or select a project before uploading slides.
    </div>

    <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
        </div>
        <div class="drop-zone-text">
            Drag & drop slide files here<br>
            or <strong id="browse-btn">browse files</strong><br>
            <small>JPG/JPEG: converted to pyramidal TIFF at 20× · DICOM WSI: upload one slide per ZIP.</small>
        </div>
        <input type="file" id="file-input" multiple>
    </div>

    <div class="file-list" id="file-list"></div>
    <div class="conflict-panel" id="conflict-panel" hidden>
        <div class="conflict-panel-head">Existing files waiting for overwrite decision</div>
        <div class="conflict-list" id="conflict-list"></div>
    </div>

    <div class="upload-footer">
        <span class="upload-summary" id="upload-summary"></span>
        <div class="upload-footer-btns">
            <button class="btn-close" id="btn-close" hidden>Close</button>
            <button class="btn-upload" id="btn-upload" disabled>Upload</button>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const API_BASE = '/api';
        const CHUNK_SIZE = 5 * 1024 * 1024;
        const SUPPORTED = /\.(isyntax|i2syntax|svs|ndpi|tif|tiff|mrxs|vms|vmu|scn|png|jpg|jpeg|zip)$/i;

        if (!localStorage.getItem('access_token')) { window.close(); return; }

        let _refreshInFlight = null;
        let _uploadKeepAliveTimer = null;

        function getAccessToken() {
            return localStorage.getItem('access_token') || '';
        }

        function getRefreshToken() {
            return localStorage.getItem('refresh_token') || '';
        }

        function setTokens(accessToken, refreshToken, expiresIn) {
            localStorage.setItem('access_token', accessToken);
            localStorage.setItem('refresh_token', refreshToken);
            localStorage.setItem('token_expires', Date.now() + Number(expiresIn || 0) * 1000);
        }

        function clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('token_expires');
            localStorage.removeItem('user');
        }

        function isTokenExpiringSoon(windowMs = 10 * 60 * 1000) {
            const expires = parseInt(localStorage.getItem('token_expires') || '0', 10);
            return !expires || Date.now() > expires - windowMs;
        }

        async function refreshTokenIfNeeded(force = false) {
            if (_refreshInFlight) return _refreshInFlight;
            if (!force && !isTokenExpiringSoon()) return true;
            const refreshToken = getRefreshToken();
            if (!refreshToken) return false;

            _refreshInFlight = (async () => {
                try {
                    const res = await fetch(`${API_BASE}/auth/refresh`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                        body: JSON.stringify({ str_refresh_token: refreshToken }),
                    });
                    if (!res.ok) return false;
                    const data = await res.json();
                    setTokens(data.str_access_token, data.str_refresh_token, data.int_expires_in);
                    if (data.dict_user) localStorage.setItem('user', JSON.stringify(data.dict_user));
                    return true;
                } catch (err) {
                    console.error('Upload token refresh failed:', err);
                    return false;
                } finally {
                    _refreshInFlight = null;
                }
            })();
            return _refreshInFlight;
        }

        function startUploadTokenKeepAlive() {
            if (_uploadKeepAliveTimer) return;
            refreshTokenIfNeeded(true);
            _uploadKeepAliveTimer = setInterval(() => {
                refreshTokenIfNeeded(true);
            }, 5 * 60 * 1000);
        }

        function stopUploadTokenKeepAlive() {
            if (_uploadKeepAliveTimer) {
                clearInterval(_uploadKeepAliveTimer);
                _uploadKeepAliveTimer = null;
            }
        }

        // text text text — text text text text
        const initialPath = new URLSearchParams(location.search).get('path') || '';
        const $projectSelect = document.getElementById('project-select');
        const $folderSelect = document.getElementById('folder-select');
        const $targetNote = document.getElementById('upload-target-note');
        const $uploadBlocked = document.getElementById('upload-blocked');
        let allFolders = [];
        let projectList = [];
        let selectedProject = (initialPath || '').split('/').filter(Boolean)[0] || '';

        function projectLabel(project) {
            return project?.info?.title || project?.name || project?.path || '';
        }

        function selectedProjectLabel() {
            const project = projectList.find(p => (p.path || p.name) === selectedProject);
            return project ? projectLabel(project) : 'selected project';
        }

        // text text text
        function setBlocked(blocked) {
            $uploadBlocked.hidden = !blocked;
            document.getElementById('drop-zone').style.display = blocked ? 'none' : '';
            document.getElementById('btn-upload').disabled = true;
        }

        function renderFolderOptions() {
            $folderSelect.innerHTML = '';
            if (!selectedProject) {
                setBlocked(true);
                $targetNote.textContent = '';
                return;
            }
            setBlocked(false);
            const rootOpt = document.createElement('option');
            rootOpt.value = selectedProject;
            rootOpt.textContent = 'Project root';
            $folderSelect.appendChild(rootOpt);
            for (const f of allFolders) {
                if (f === selectedProject) continue;
                if (!f.startsWith(`${selectedProject}/`)) continue;
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = '/' + f.split('/').slice(1).join('/');
                $folderSelect.appendChild(opt);
            }
            if (initialPath && initialPath.split('/')[0] === selectedProject &&
                [...$folderSelect.options].some(o => o.value === initialPath)) {
                $folderSelect.value = initialPath;
            }
            $targetNote.textContent = `Uploads will be saved under project "${selectedProjectLabel()}".`;
        }

        function renderProjectOptions() {
            $projectSelect.innerHTML = '';
            for (const p of projectList) {
                const opt = document.createElement('option');
                opt.value = p.path || p.name;
                opt.textContent = projectLabel(p);
                $projectSelect.appendChild(opt);
            }
            if (!selectedProject && projectList.length) selectedProject = projectList[0].path || projectList[0].name;
            const hasSelected = selectedProject && [...$projectSelect.options].some(o => o.value === selectedProject);
            if (hasSelected) {
                $projectSelect.value = selectedProject;
            } else {
                selectedProject = '';
            }
            renderFolderOptions();
        }

        (async function loadFolderTree() {
            try {
                const [projectRes, folderRes] = await Promise.all([
                    authFetch('/slides/projects'),
                    authFetch('/slides/folder-tree'),
                ]);
                if (projectRes.ok) projectList = (await projectRes.json()).projects || [];
                if (folderRes.ok) allFolders = (await folderRes.json()).folders || [];
                renderProjectOptions();
                return;
                const res = await authFetch('/slides/folder-tree');
                if (!res.ok) return;
                const { folders } = await res.json();
                for (const f of folders) {
                    const opt = document.createElement('option');
                    opt.value = f;
                    opt.textContent = '/' + f;
                    $folderSelect.appendChild(opt);
                }
                // text text text
                if (initialPath && [...$folderSelect.options].some(o => o.value === initialPath)) {
                    $folderSelect.value = initialPath;
                }
            } catch { /* text text text root text text */ }
        })();

        $projectSelect.addEventListener('change', () => {
            selectedProject = $projectSelect.value;
            renderFolderOptions();
        });

        function getUploadPath() { return $folderSelect.value; }

        const $dropZone = document.getElementById('drop-zone');
        const $fileInput = document.getElementById('file-input');
        const $fileList = document.getElementById('file-list');
        const $btnUpload = document.getElementById('btn-upload');
        const $btnClose = document.getElementById('btn-close');
        const $summary = document.getElementById('upload-summary');
        const $conflictPanel = document.getElementById('conflict-panel');
        const $conflictList = document.getElementById('conflict-list');

        let fileQueue = [];      // {file, el, status, fillEl, statusEl}
        let isUploading = false;
        let completedCount = 0;
        let errorCount = 0;
        let skippedCount = 0;

        // ── Auth fetch ──
        async function authFetch(path, options = {}) {
            await refreshTokenIfNeeded();
            const headers = { ...(options.headers || {}) };
            headers['Authorization'] = `Bearer ${getAccessToken()}`;
            headers['X-Requested-With'] = 'XMLHttpRequest';
            let res = await fetch(`${API_BASE}${path}`, { ...options, headers });
            if (res.status === 401 && await refreshTokenIfNeeded(true)) {
                const retryHeaders = { ...(options.headers || {}) };
                retryHeaders['Authorization'] = `Bearer ${getAccessToken()}`;
                retryHeaders['X-Requested-With'] = 'XMLHttpRequest';
                res = await fetch(`${API_BASE}${path}`, { ...options, headers: retryHeaders });
            }
            if (res.status === 401) {
                clearTokens();
                throw new Error('Login expired during upload');
            }
            return res;
        }

        // ── File selection ──
        document.getElementById('browse-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            $fileInput.click();
        });
        $dropZone.addEventListener('click', () => {
            $fileInput.click();
        });
        $fileInput.addEventListener('change', (e) => addFiles(e.target.files));

        // ── Drag & drop ──
        $dropZone.addEventListener('dragover', (e) => { e.preventDefault(); $dropZone.classList.add('dragover'); });
        $dropZone.addEventListener('dragleave', () => $dropZone.classList.remove('dragover'));
        $dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            $dropZone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });

        // ── Opener text text text ──
        if (window.opener && window.opener._pendingUploadFiles) {
            const files = window.opener._pendingUploadFiles;
            window.opener._pendingUploadFiles = null;
            setTimeout(() => addFiles(files), 100);
        }

        function addFiles(fileListObj) {
            if (!getUploadPath()) {
                alert('Select a project before adding files.');
                return;
            }
            const files = [...fileListObj].filter(f => SUPPORTED.test(f.name));
            if (!files.length) return;

            for (const file of files) {
                // text text
                if (fileQueue.some(q => q.file.name === file.name && q.file.size === file.size)) continue;

                const el = document.createElement('div');
                el.className = 'file-item';
                el.innerHTML = `
                    <div class="file-item-top">
                        <span class="file-item-name" title="${file.name}">${file.name}</span>
                        <span class="file-item-size">${formatSize(file.size)}</span>
                        <span class="file-item-status status-waiting">Waiting</span>
                    </div>
                    <div class="file-item-bar"><div class="file-item-fill"></div></div>
                `;
                $fileList.appendChild(el);

                fileQueue.push({
                    file,
                    el,
                    status: 'waiting',
                    fillEl: el.querySelector('.file-item-fill'),
                    statusEl: el.querySelector('.file-item-status'),
                });
            }

            updateSummary();
            $btnUpload.disabled = false;
        }

        function formatSize(bytes) {
            const mb = bytes / (1024 * 1024);
            if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
            return mb.toFixed(1) + ' MB';
        }

        function updateSummary() {
            const total = fileQueue.length;
            const pending = total - completedCount - errorCount;
            if (isUploading) {
                $summary.textContent = `Uploading... ${completedCount}/${total} done` + (errorCount ? `, ${errorCount} failed` : '');
            } else if (completedCount > 0) {
                $summary.textContent = `${completedCount}/${total} uploaded`
                    + (errorCount ? `, ${errorCount} failed` : '')
                    + (skippedCount ? `, ${skippedCount} skipped` : '');
            } else {
                $summary.textContent = `${total} file${total > 1 ? 's' : ''} selected`;
            }
        }

        function setItemStatus(item, status, text) {
            item.status = status;
            item.statusEl.textContent = text;
            item.statusEl.className = 'file-item-status status-' + status;
        }

        function renderConflictPanel() {
            const conflicts = fileQueue.filter(item => item.status === 'conflict');
            $conflictPanel.hidden = conflicts.length === 0;
            $conflictList.innerHTML = '';
            for (const item of conflicts) {
                const row = document.createElement('div');
                row.className = 'conflict-item';
                row.innerHTML = `
                    <span class="conflict-name" title="${item.file.name}">${item.file.name}</span>
                    <button type="button" class="conflict-action overwrite">Overwrite</button>
                    <button type="button" class="conflict-action skip">Skip</button>
                `;
                row.querySelector('.overwrite').addEventListener('click', () => overwriteConflict(item));
                row.querySelector('.skip').addEventListener('click', () => skipConflict(item));
                $conflictList.appendChild(row);
            }
        }

        function markConflict(item, detail = {}) {
            item.conflictDetail = detail;
            setItemStatus(item, 'conflict', 'Exists');
            item.fillEl.classList.remove('error', 'done');
            item.fillEl.classList.add('conflict');
            item.fillEl.style.width = '100%';
            renderConflictPanel();
        }

        function skipConflict(item) {
            item.fillEl.classList.remove('conflict');
            setItemStatus(item, 'skipped', 'Skipped');
            skippedCount++;
            renderConflictPanel();
            updateSummary();
        }

        async function overwriteConflict(item) {
            if (item.status !== 'conflict') return;
            setItemStatus(item, 'uploading', 'Deleting old file...');
            item.fillEl.classList.remove('conflict', 'error', 'done');
            item.fillEl.style.width = '8%';
            renderConflictPanel();
            startUploadTokenKeepAlive();
            try {
                await deleteExistingFile(item.conflictDetail?.filename || item.file.name);
                const result = await uploadOneFile(item, { overwrite: true });
                setItemStatus(item, 'done', result?.converted_from_jpeg ? `Converted → ${result.filename}` : 'Overwritten');
                item.fillEl.classList.add('done');
                item.fillEl.style.width = '100%';
                completedCount++;
            } catch (err) {
                setItemStatus(item, 'error', err.message || 'Overwrite failed');
                item.fillEl.classList.add('error');
                item.fillEl.style.width = '100%';
                errorCount++;
            } finally {
                stopUploadTokenKeepAlive();
            }
            renderConflictPanel();
            updateSummary();
            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'upload-complete', count: completedCount }, '*');
                }
            } catch { /* cross-origin or closed */ }
        }

        async function deleteExistingFile(filename) {
            const form = new FormData();
            form.append('filenames_json', JSON.stringify([filename]));
            form.append('path', getUploadPath());
            const res = await authFetch('/slides/file/delete', { method: 'POST', body: form });
            if (!res.ok) throw new Error('Could not delete existing file');
            const data = await res.json();
            if (Array.isArray(data.errors) && data.errors.length) {
                throw new Error(data.errors[0]?.error || 'Could not delete existing file');
            }
            return data;
        }

        async function responseErrorMessage(res, fallback) {
            try {
                const data = await res.clone().json();
                const detail = data.detail || data.message || '';
                if (typeof detail === 'string' && detail.trim()) return detail;
            } catch (_) { /* ignore */ }
            try {
                const text = await res.text();
                if (text && text.trim()) return text;
            } catch (_) { /* ignore */ }
            return fallback;
        }

        // ── Upload ──
        $btnUpload.addEventListener('click', startUpload);

        async function startUpload() {
            if (isUploading) return;
            if (!getUploadPath()) {
                alert('Select a project before uploading.');
                return;
            }
            isUploading = true;
            $btnUpload.disabled = true;
            $dropZone.style.display = 'none';
            $projectSelect.disabled = true;
            $folderSelect.disabled = true;
            completedCount = 0;
            errorCount = 0;
            skippedCount = 0;

            // text text text
            window.onbeforeunload = () => '';
            startUploadTokenKeepAlive();

            try {
                for (const item of fileQueue) {
                    if (item.status === 'done' || item.status === 'conflict' || item.status === 'skipped') continue;
                    try {
                        setItemStatus(item, 'uploading', 'Uploading...');
                        const result = await uploadOneFile(item);
                        if (item.status === 'conflict') {
                            updateSummary();
                            continue;
                        }
                        setItemStatus(item, 'done', result?.converted_from_jpeg ? `Converted → ${result.filename}` : 'Done');
                        item.fillEl.classList.add('done');
                        item.fillEl.style.width = '100%';
                        completedCount++;
                    } catch (err) {
                        if (err && err.alreadyHandled) {
                            updateSummary();
                            continue;
                        }
                        setItemStatus(item, 'error', err.message || 'Failed');
                        item.fillEl.classList.add('error');
                        item.fillEl.style.width = '100%';
                        errorCount++;
                    }
                    updateSummary();
                }
            } finally {
                stopUploadTokenKeepAlive();
            }

            isUploading = false;
            window.onbeforeunload = null;
            $btnClose.hidden = false;
            $btnUpload.textContent = 'Done';
            updateSummary();

            // opener text text text
            try {
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'upload-complete', count: completedCount }, '*');
                }
            } catch { /* cross-origin or closed */ }
        }

        async function uploadOneFile(item, options = {}) {
            const file = item.file;
            const overwrite = Boolean(options.overwrite);

            // 1) text text text
            if (!overwrite) {
                const checkForm = new FormData();
                checkForm.append('filename', file.name);
                checkForm.append('path', getUploadPath());
                const checkRes = await authFetch(`/slides/open-by-name`, { method: 'POST', body: checkForm });
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    if (checkData.exists) {
                        markConflict(item, checkData);
                        throw { alreadyHandled: true };
                    }
                }
            }

            // 2) text text
            const startForm = new FormData();
            startForm.append('filename', file.name);
            const startRes = await authFetch('/slides/upload/start', { method: 'POST', body: startForm });
            if (!startRes.ok) throw new Error(await responseErrorMessage(startRes, 'File format is not supported'));
            const { upload_id } = await startRes.json();

            // 3) text text
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
            for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const blob = file.slice(start, Math.min(start + CHUNK_SIZE, file.size));
                const chunkForm = new FormData();
                chunkForm.append('upload_id', upload_id);
                chunkForm.append('chunk_index', i.toString());
                chunkForm.append('chunk', blob);
                const chunkRes = await authFetch('/slides/upload/chunk', { method: 'POST', body: chunkForm });
                if (!chunkRes.ok) throw new Error(await responseErrorMessage(chunkRes, `Chunk ${i + 1} failed`));
                item.fillEl.style.width = Math.round(((i + 1) / totalChunks) * 90) + '%';
                setItemStatus(item, 'uploading', `${Math.round(((i + 1) / totalChunks) * 90)}%`);
            }

            // 4) text
            const isJpeg = /\.jpe?g$/i.test(file.name);
            setItemStatus(item, 'uploading', isJpeg ? 'Converting to pyramidal TIFF...' : 'Registering...');
            item.fillEl.style.width = '95%';
            const completeForm = new FormData();
            completeForm.append('upload_id', upload_id);
            completeForm.append('filename', file.name);
            completeForm.append('total_chunks', totalChunks.toString());
            completeForm.append('path', getUploadPath());
            const completeRes = await authFetch('/slides/upload/complete', { method: 'POST', body: completeForm });
            if (!completeRes.ok) {
                const message = await responseErrorMessage(completeRes, 'Complete failed');
                if (/OpenSlide|Unsupported slide|could not open|not open/i.test(message)) {
                    throw new Error('Not a supported slide file');
                }
                throw new Error(message);
            }
            return await completeRes.json();
        }

        // ── Close ──
        $btnClose.addEventListener('click', () => window.close());

    })();
    </script>
</body>
</html>
