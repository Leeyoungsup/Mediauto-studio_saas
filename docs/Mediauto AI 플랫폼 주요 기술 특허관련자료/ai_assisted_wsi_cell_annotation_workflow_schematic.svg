<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFD"/>
      <stop offset="1" stop-color="#F1F5FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17325C" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#087F8C"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#C84A52"/>
    </marker>
    <clipPath id="clipStage1" clipPathUnits="userSpaceOnUse">
      <rect x="34" y="105" width="272" height="262" rx="18"/>
    </clipPath>
    <clipPath id="clipStage2" clipPathUnits="userSpaceOnUse">
      <rect x="50" y="112" width="260" height="250" rx="16"/>
    </clipPath>
    <clipPath id="clipStage3" clipPathUnits="userSpaceOnUse">
      <rect x="42" y="108" width="271" height="252" rx="17"/>
    </clipPath>
    <clipPath id="clipStage5" clipPathUnits="userSpaceOnUse">
      <rect x="38" y="108" width="459" height="185" rx="18"/>
    </clipPath>
    <style>
      text { font-family: "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #172B4D; }
      .title { font-size: 58px; font-weight: 700; fill: #162B55; }
      .subtitle { font-size: 25px; fill: #66768F; }
      .step-num { font-size: 25px; font-weight: 700; fill: white; }
      .step-title { font-size: 28px; font-weight: 700; fill: #172B4D; }
      .body { font-size: 22px; fill: #334765; }
      .small { font-size: 19px; fill: #62738D; }
      .tiny { font-size: 17px; fill: #6A7890; }
      .mono { font-family: "Noto Sans Mono CJK KR", monospace; font-size: 22px; fill: #172B4D; }
      .status { font-size: 19px; font-weight: 600; }
      .card { fill: white; stroke: #D6E0EC; stroke-width: 3; filter: url(#shadow); }
      .flow { fill: none; stroke: #64748B; stroke-width: 5; marker-end: url(#arrow); }
      .teal-flow { fill: none; stroke: #087F8C; stroke-width: 5; marker-end: url(#arrowTeal); }
      .red-flow { fill: none; stroke: #C84A52; stroke-width: 4; marker-end: url(#arrowRed); }
    </style>
  </defs>

  <rect width="2400" height="1500" fill="url(#bg)"/>

  <text x="90" y="92" class="title">AI-assisted WSI Cell Annotation Workflow 개략도</text>
  <text x="92" y="135" class="subtitle">영역 지정부터 Patch Task 생성, AI Cell 후보 제공, 사람 검수 및 최종 확정까지의 실제 구현 흐름</text>

  <!-- main cards -->
  <g transform="translate(70,210)">
    <rect class="card" width="340" height="640" rx="28"/>
    <circle cx="47" cy="47" r="27" fill="#3E6AE1"/>
    <text x="39" y="56" class="step-num">1</text>
    <text x="88" y="57" class="step-title">패치 생성 영역 지정</text>

    <rect x="34" y="105" width="272" height="262" rx="18" fill="#F7F9FC" stroke="#CAD6E5" stroke-width="2"/>
    <image href="workflow_actual_region_view.png" x="34" y="105" width="272" height="262"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#clipStage1)"/>
    <rect x="34" y="105" width="272" height="262" rx="18" fill="none" stroke="#CAD6E5" stroke-width="2"/>

    <rect x="42" y="398" width="22" height="22" rx="4" fill="#E6F5F3" stroke="#087F8C" stroke-width="3"/>
    <text x="78" y="417" class="body">패치 생성 대상 영역</text>
    <rect x="42" y="448" width="22" height="22" rx="4" fill="#FFF4F3" stroke="#C84A52" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="78" y="467" class="body">패치 생성 제외 영역</text>
    <text x="42" y="529" class="small">사용자가 WSI Level-0</text>
    <text x="42" y="560" class="small">좌표계에서 다각형 지정</text>
    <rect x="34" y="590" width="272" height="1" fill="#D8E1EC"/>
    <text x="42" y="623" class="tiny">입력: polygon 좌표 목록</text>
  </g>

  <path d="M420 530 H470" class="flow"/>

  <g transform="translate(480,210)">
    <rect class="card" width="360" height="640" rx="28"/>
    <circle cx="47" cy="47" r="27" fill="#3E6AE1"/>
    <text x="39" y="56" class="step-num">2</text>
    <text x="88" y="57" class="step-title">Patch Task 생성</text>

    <rect x="50" y="112" width="260" height="250" rx="16" fill="#F7F9FC" stroke="#CAD6E5" stroke-width="2"/>
    <image href="workflow_actual_patch_grid.png" x="50" y="112" width="260" height="250"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#clipStage2)"/>
    <rect x="50" y="112" width="260" height="250" rx="16" fill="none" stroke="#CAD6E5" stroke-width="2"/>

    <text x="45" y="408" class="body">• 대상 영역과 교차하는 격자 생성</text>
    <text x="45" y="449" class="body">• 제외 영역과 교차하면 제외</text>
    <text x="45" y="490" class="body">• 경계 패치는 영상 범위로 절단</text>
    <rect x="39" y="526" width="282" height="76" rx="14" fill="#EEF3FF" stroke="#8AA5EA" stroke-width="2"/>
    <text x="56" y="557" class="mono">P_slide = round(512 / M_slide)</text>
    <text x="56" y="584" class="small">약 512 μm × 512 μm</text>
    <text x="45" y="627" class="tiny">고정 격자 위치로 patch ID 유지</text>
  </g>

  <path d="M850 530 H900" class="flow"/>

  <g transform="translate(910,210)">
    <rect class="card" width="355" height="640" rx="28"/>
    <circle cx="47" cy="47" r="27" fill="#087F8C"/>
    <text x="39" y="56" class="step-num">3</text>
    <text x="88" y="57" class="step-title">WSI AI Cell 후보</text>

    <rect x="42" y="108" width="271" height="252" rx="17" fill="#F7F9FC" stroke="#CAD6E5" stroke-width="2"/>
    <image href="workflow_actual_ai_cells.png" x="42" y="108" width="271" height="252"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#clipStage3)"/>
    <rect x="42" y="108" width="271" height="252" rx="17" fill="none" stroke="#CAD6E5" stroke-width="2"/>
    <rect x="54" y="318" width="247" height="30" rx="10" fill="#FFFFFF" fill-opacity="0.88"/>
    <text x="70" y="339" class="tiny">실제 Patch View의 Cell 후보</text>

    <text x="43" y="405" class="body">Cell 후보별 저장 정보</text>
    <g transform="translate(42,430)">
      <rect width="271" height="153" rx="14" fill="#ECF8F6" stroke="#95CFC7" stroke-width="2"/>
      <text x="18" y="34" class="small">• 중심 좌표 (x, y)</text>
      <text x="18" y="67" class="small">• Bounding Box</text>
      <text x="18" y="100" class="small">• Cell 클래스</text>
      <text x="18" y="133" class="small">• 예측 신뢰도</text>
    </g>
    <text x="43" y="625" class="tiny">패치별 AI 재실행 방식이 아님</text>
  </g>

  <path d="M1275 530 H1323" class="flow"/>

  <g transform="translate(1335,210)">
    <rect class="card" width="390" height="640" rx="28"/>
    <circle cx="47" cy="47" r="27" fill="#087F8C"/>
    <text x="39" y="56" class="step-num">4</text>
    <text x="88" y="57" class="step-title">패치별 후보 배분</text>

    <path d="M195 105 L320 181 L195 257 L70 181 Z" fill="#FFF8E8" stroke="#DB9B22" stroke-width="4"/>
    <text x="125" y="170" class="body" style="font-weight:700">상태가 required?</text>
    <text x="119" y="204" class="body" style="font-weight:700">저장 Cell이 없음?</text>

    <path d="M195 258 V310" class="teal-flow"/>
    <text x="211" y="294" class="small" style="fill:#087F8C">Yes</text>
    <rect x="53" y="324" width="284" height="103" rx="16" fill="#EAF8F4" stroke="#15956B" stroke-width="3"/>
    <text x="79" y="360" class="body" style="font-weight:700">후보 중심점이 패치 범위에</text>
    <text x="90" y="395" class="body" style="font-weight:700">포함되는 Cell만 추출</text>

    <path d="M319 181 H359 V472 H337" class="red-flow"/>
    <text x="330" y="161" class="small" style="fill:#C84A52">No</text>
    <rect x="53" y="466" width="284" height="95" rx="16" fill="#FFF1F2" stroke="#C84A52" stroke-width="3"/>
    <text x="97" y="503" class="body" style="font-weight:700">기존 Cell 유지</text>
    <text x="78" y="537" class="small">AI 후보 미적용 · 덮어쓰기 없음</text>

    <rect x="53" y="589" width="284" height="34" rx="10" fill="#EEF2F7"/>
    <text x="72" y="612" class="tiny">required + empty patch에서만 초기 제안</text>
  </g>

  <path d="M1735 530 H1783" class="flow"/>

  <g transform="translate(1795,210)">
    <rect class="card" width="535" height="640" rx="28"/>
    <circle cx="47" cy="47" r="27" fill="#6554D9"/>
    <text x="39" y="56" class="step-num">5</text>
    <text x="88" y="57" class="step-title">사람 검수 및 Workflow 상태 관리</text>

    <rect x="38" y="108" width="459" height="185" rx="18" fill="#F8F7FF" stroke="#B7ADEF" stroke-width="2"/>
    <image href="workflow_actual_patch_review.png" x="38" y="108" width="459" height="185"
           preserveAspectRatio="xMidYMid slice" clip-path="url(#clipStage5)"/>
    <rect x="38" y="108" width="459" height="185" rx="18" fill="none" stroke="#B7ADEF" stroke-width="2"/>
    <rect x="52" y="246" width="431" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.9"/>
    <text x="70" y="269" class="tiny">실제 Cell Class · Annotation 검수 화면</text>

    <g transform="translate(38,330)">
      <rect width="459" height="76" rx="16" fill="#EAF0FF" stroke="#7594E8" stroke-width="2"/>
      <text x="27" y="32" class="status" style="fill:#315FCF">required</text>
      <path d="M118 38 H155" class="flow"/>
      <text x="173" y="32" class="status" style="fill:#315FCF">in_progress</text>
      <path d="M292 38 H329" class="flow"/>
      <text x="347" y="32" class="status" style="fill:#315FCF">completed</text>
      <text x="27" y="61" class="tiny">annotation 대기</text>
      <text x="175" y="61" class="tiny">사람 작업</text>
      <text x="349" y="61" class="tiny">검수 요청</text>
    </g>

    <g transform="translate(38,435)">
      <rect width="459" height="154" rx="16" fill="#F0FAF6" stroke="#65B998" stroke-width="2"/>
      <text x="23" y="31" class="status" style="fill:#168A57">Review</text>
      <rect x="23" y="45" width="124" height="43" rx="13" fill="#DFF5E9" stroke="#168A57" stroke-width="2"/>
      <text x="47" y="74" class="status" style="fill:#168A57">reviewed</text>
      <path d="M151 66 H293" class="teal-flow"/>
      <text x="183" y="51" class="tiny">승인 시</text>
      <text x="310" y="73" class="status" style="fill:#087F8C">Termination</text>
      <rect x="23" y="102" width="124" height="38" rx="12" fill="#FFF0F1" stroke="#C84A52" stroke-width="2"/>
      <text x="51" y="128" class="status" style="fill:#C84A52">rejected</text>
      <path d="M151 121 H273" class="red-flow"/>
      <text x="291" y="128" class="tiny" style="fill:#C84A52">기존 Cell 재수정</text>
    </g>

    <text x="39" y="630" class="tiny">수정 결과는 패치별 Cell Annotation과 상태로 저장</text>
  </g>

  <!-- common coordinate band -->
  <g transform="translate(70,930)">
    <rect width="2260" height="430" rx="30" fill="#FFFFFF" stroke="#BFD0E0" stroke-width="3" filter="url(#shadow)"/>
    <rect width="2260" height="78" rx="30" fill="#16335F"/>
    <rect y="52" width="2260" height="26" fill="#16335F"/>
    <text x="45" y="52" style="font-size:31px;font-weight:700;fill:white">공통 WSI Level-0 좌표계와 Patch View 연동</text>

    <g transform="translate(45,118)">
      <rect width="465" height="245" rx="18" fill="#F7F9FC" stroke="#CBD7E5" stroke-width="2"/>
      <image href="workflow_actual_patch_grid.png" x="0" y="0" width="465" height="245" preserveAspectRatio="xMidYMid slice"/>
      <rect width="465" height="245" rx="18" fill="none" stroke="#CBD7E5" stroke-width="2"/>
      <rect x="242" y="84" width="88" height="80" fill="#DCE7FF" fill-opacity="0.32" stroke="#315FCF" stroke-width="5"/>
      <rect x="16" y="204" width="232" height="31" rx="9" fill="#FFFFFF" fill-opacity="0.9"/>
      <text x="27" y="227" class="small">전체 WSI 좌표 (x, y)</text>
    </g>

    <path d="M555 240 H680" class="teal-flow"/>

    <g transform="translate(705,118)">
      <rect width="445" height="245" rx="18" fill="#F7F9FC" stroke="#CBD7E5" stroke-width="2"/>
      <image href="workflow_actual_ai_cells.png" x="55" y="38" width="205" height="170" preserveAspectRatio="xMidYMid slice"/>
      <rect x="55" y="38" width="205" height="170" fill="none" stroke="#8F77A0" stroke-width="3"/>
      <line x1="55" y1="38" x2="55" y2="208" stroke="#172B4D" stroke-width="3"/>
      <line x1="55" y1="38" x2="260" y2="38" stroke="#172B4D" stroke-width="3"/>
      <text x="24" y="32" class="small">(x_p, y_p)</text>
      <line x1="55" y1="38" x2="155" y2="111" stroke="#087F8C" stroke-width="4" marker-end="url(#arrowTeal)"/>
      <text x="123" y="77" class="mono">u</text>
      <text x="76" y="123" class="mono">v</text>
      <circle cx="155" cy="111" r="8" fill="#C84A52"/>
      <text x="282" y="82" class="small">Patch View</text>
      <text x="282" y="118" class="small">로컬 좌표</text>
      <text x="282" y="154" class="mono">(u, v)</text>
      <text x="25" y="232" class="small">패치 원점 + Cell 로컬 위치</text>
    </g>

    <g transform="translate(1215,118)">
      <rect width="1000" height="245" rx="18" fill="#EFF8FA" stroke="#79B9C1" stroke-width="3"/>
      <text x="44" y="52" style="font-size:27px;font-weight:700;fill:#087F8C">좌표 변환 및 이중 저장</text>
      <text x="44" y="105" class="mono" style="font-size:29px">x = x_p + u,    y = y_p + v</text>
      <text x="44" y="155" class="mono" style="font-size:29px">u = x − x_p,    v = y − y_p</text>
      <line x1="44" y1="183" x2="956" y2="183" stroke="#A8C9CF" stroke-width="2"/>
      <text x="44" y="220" class="body">WSI 전체 화면과 Patch View가 동일 객체를 정확히 같은 위치에 표시</text>
    </g>
  </g>

  <text x="90" y="1428" class="small">핵심: 물리 크기가 정규화된 Patch Task + required 상태의 빈 패치에만 AI Cell 후보 제공 + 공통 Level-0 좌표계 기반 사람 검수</text>
</svg>
