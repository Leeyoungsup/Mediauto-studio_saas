<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      .title { font: 700 38px "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #172033; }
      .box-title { font: 700 25px "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #172033; }
      .body { font: 500 20px "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #344054; }
      .small { font: 500 18px "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #475467; }
      .label { font: 700 18px "Noto Sans CJK KR", "Noto Sans KR", sans-serif; fill: #344054; }
      .box { stroke-width: 2.5; rx: 18; ry: 18; }
      .flow { fill: none; stroke: #344054; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #667085; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-muted); }
      .divider { stroke: #98a2b3; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#344054"/>
    </marker>
    <marker id="arrow-muted" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#667085"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1180" fill="#ffffff"/>
  <text x="800" y="65" text-anchor="middle" class="title">WSI Adaptive Tile Streaming 시스템 구성 및 데이터 흐름</text>

  <!-- Client -->
  <rect x="455" y="105" width="690" height="150" class="box" fill="#eef4ff" stroke="#5285d8" filter="url(#shadow)"/>
  <text x="800" y="150" text-anchor="middle" class="box-title">클라이언트 WSI 뷰어</text>
  <text x="800" y="187" text-anchor="middle" class="body">현재 viewport·zoom 기준 타일 좌표 산출 및 요청</text>
  <text x="800" y="220" text-anchor="middle" class="small">대기 중에는 parent tile 또는 thumbnail fallback 표시</text>

  <!-- Client to service -->
  <path d="M800 255 L800 335" class="flow"/>
  <text x="820" y="302" class="label">타일 GET 요청</text>

  <!-- Tile service -->
  <rect x="390" y="340" width="820" height="180" class="box" fill="#f2f8ff" stroke="#3973bd" filter="url(#shadow)"/>
  <text x="800" y="385" text-anchor="middle" class="box-title">타일 서비스 / Viewer Executor</text>
  <text x="800" y="424" text-anchor="middle" class="body">캐시 유효성·타일 존재 여부 확인</text>
  <line x1="540" y1="448" x2="1060" y2="448" class="divider"/>
  <text x="800" y="483" text-anchor="middle" class="body">Cache miss 시 inline 또는 queued 처리 선택</text>

  <!-- Cache -->
  <rect x="1260" y="340" width="285" height="225" class="box" fill="#effaf4" stroke="#3b9b65" filter="url(#shadow)"/>
  <text x="1402" y="385" text-anchor="middle" class="box-title">타일 캐시 저장소</text>
  <text x="1402" y="425" text-anchor="middle" class="body">Level 0·1·2</text>
  <text x="1402" y="458" text-anchor="middle" class="body">JPEG 타일</text>
  <line x1="1300" y1="480" x2="1505" y2="480" class="divider"/>
  <text x="1402" y="516" text-anchor="middle" class="small">.complete marker</text>
  <text x="1402" y="544" text-anchor="middle" class="small">원본 식별정보</text>

  <!-- Cache hit exchange -->
  <path d="M1210 395 L1255 395" class="flow"/>
  <text x="1232" y="375" text-anchor="middle" class="label">조회</text>
  <path d="M1260 475 L1215 475" class="return"/>
  <text x="1402" y="315" text-anchor="middle" class="label">Cache hit → JPEG 즉시 반환</text>

  <!-- Decision split -->
  <path d="M800 520 L800 590" class="flow"/>
  <polygon points="800,585 945,665 800,745 655,665" fill="#fff7e8" stroke="#db8b23" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="800" y="652" text-anchor="middle" class="box-title">Cache miss</text>
  <text x="800" y="684" text-anchor="middle" class="small">서버 부하·level·포맷 판단</text>

  <!-- Inline branch -->
  <path d="M655 665 L485 665 L485 760" class="flow"/>
  <text x="555" y="642" text-anchor="middle" class="label">Inline 허용</text>
  <rect x="195" y="765" width="580" height="145" class="box" fill="#fff5e8" stroke="#dc8a26" filter="url(#shadow)"/>
  <text x="485" y="810" text-anchor="middle" class="box-title">Inline Tile Generation</text>
  <text x="485" y="849" text-anchor="middle" class="body">영역 추출 → resize·색상 보정 → JPEG 생성</text>
  <text x="485" y="880" text-anchor="middle" class="small">제한시간 내 완료 시 캐시 저장 후 즉시 응답</text>

  <!-- Queued branch -->
  <path d="M945 665 L1115 665 L1115 760" class="flow"/>
  <text x="1045" y="642" text-anchor="middle" class="label">Queued 처리</text>
  <rect x="825" y="765" width="580" height="145" class="box" fill="#f5f3ff" stroke="#7666c9" filter="url(#shadow)"/>
  <text x="1115" y="810" text-anchor="middle" class="box-title">Background Generator / Tile Executor</text>
  <text x="1115" y="849" text-anchor="middle" class="body">요청 위치의 stage block을 우선 처리</text>
  <text x="1115" y="880" text-anchor="middle" class="small">이후 전체 3단계 타일 피라미드 생성</text>

  <!-- Source WSI -->
  <rect x="485" y="980" width="630" height="130" class="box" fill="#f8fafc" stroke="#64748b" filter="url(#shadow)"/>
  <text x="800" y="1025" text-anchor="middle" class="box-title">원본 WSI 저장소 / Philips Bridge</text>
  <text x="800" y="1064" text-anchor="middle" class="body">일반 포맷: OpenSlide · 특수 포맷: 별도 bridge process</text>

  <!-- Source access -->
  <path d="M485 910 L485 945 L690 945 L690 975" class="flow"/>
  <text x="575" y="938" text-anchor="middle" class="label">원본 영역 읽기</text>
  <path d="M1115 910 L1115 945 L910 945 L910 975" class="flow"/>
  <text x="1025" y="938" text-anchor="middle" class="label">원본 block 읽기</text>

  <!-- Writes to cache -->
  <path d="M1405 820 L1490 820 L1490 570" class="flow"/>
  <text x="1470" y="750" transform="rotate(-90 1470 750)" text-anchor="middle" class="label">피라미드·marker 저장</text>

  <!-- Retry to client -->
  <path d="M1545 430 C1580 430 1580 180 1150 180" class="return"/>
  <text x="1450" y="150" text-anchor="middle" class="label">재요청 시 캐시 타일 반환</text>

  <!-- Inline direct response -->
  <path d="M195 835 L100 835 L100 180 L450 180" class="return"/>
  <text x="120" y="520" transform="rotate(-90 120 520)" text-anchor="middle" class="label">생성 완료 JPEG 응답</text>

  <!-- Legend -->
  <line x1="1250" y1="1128" x2="1315" y2="1128" class="flow"/>
  <text x="1330" y="1135" class="small">처리·저장 흐름</text>
  <line x1="1250" y1="1160" x2="1315" y2="1160" class="return"/>
  <text x="1330" y="1167" class="small">응답·재요청 흐름</text>
</svg>
